<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Bar with Left and Right Buttons</title>
<style>
    .container {
        width: 300px;
        overflow-x: scroll;
        white-space: nowrap;
        position: relative;
    }

    .content {
        display: inline-block;
        width: auto;
        height: 200px;
    }

    .scroll-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 5px 10px;
        cursor: pointer;
        z-index: 1;
    }

    .scroll-left {
        left: 0;
    }

    .scroll-right {
        right: 0;
    }
</style>
</head>
<body>
    <div class="container" id="container">
        <div class="content" style="background-color: #ccc;">Content 1</div>
        <div class="content" style="background-color: #eee;">Content 2</div>
        <div class="content" style="background-color: #aaa;">Content 3</div>
        <div class="content" style="background-color: #aaa;">Content 4</div>
        <div class="content" style="background-color: #aaa;">Content 5</div>
        <div class="content" style="background-color: #aaa;">Content 6</div>
        <div class="content" style="background-color: #aaa;">Content 7</div>
    </div>
    <div class="scroll-btn scroll-left" onclick="scrollContent('left')">Left</div>
    <div class="scroll-btn scroll-right" onclick="scrollContent('right')">Right</div>

    <script>
        function scrollContent(direction) {
            var container = document.getElementById('container');
            var scrollAmount = 300; // Adjust this value as needed
            if (direction === 'left') {
                container.scrollLeft -= scrollAmount;
            } else {
                container.scrollLeft += scrollAmount;
            }
        }
    </script>
</body>
</html>
